<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBAR Nurse Report Pro — Free Demo</title>

<script>
(function(){
  try{
    const installed =
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
      window.navigator.standalone === true;
    if(installed) document.documentElement.classList.add('installed-app');
  }catch(e){}
})();
</script>

<style>
:root{
  --navy:#16324F;--teal:#0F9B8E;--cyan:#38BFC3;--mint:#DDF5F0;--blue:#EAF4FA;
  --bg:#F5FAFC;--bg2:#EDF7F7;--card:#FFFFFF;--text:#17324D;--muted:#6B7D8F;
  --line:#DCE9EE;--success:#5FAE8B;--amber:#E5A84B;--danger:#E57972;--shadow:0 12px 30px rgba(22,50,79,.09);
  --radius:20px;--accent:#0F9B8E;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:
radial-gradient(circle at 10% 10%,rgba(56,191,195,.08),transparent 26%),
radial-gradient(circle at 85% 20%,rgba(15,155,142,.06),transparent 28%),
var(--bg);color:var(--text);min-height:100vh}
body.dark{
  --bg:#0E1A26;--bg2:#132333;--card:#162B3B;--text:#EAF4FA;--muted:#9FB1BF;--line:#274356;--shadow:0 12px 28px rgba(0,0,0,.24)
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,#15334F 0%,#0F5D69 100%);color:white;padding:24px 18px;display:flex;flex-direction:column;z-index:5}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.brand-mark{width:46px;height:46px;border-radius:14px;border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;background:rgba(255,255,255,.1);position:relative}
.brand-mark:before,.brand-mark:after{content:"";position:absolute;background:white;border-radius:2px}
.brand-mark:before{width:22px;height:5px}
.brand-mark:after{width:5px;height:22px}
.brand-name{font-weight:800;line-height:1.05;font-size:16px}
.pro{display:inline-block;margin-left:6px;background:#2DD4BF;color:#073642;padding:3px 7px;border-radius:999px;font-size:10px;font-weight:900}
.shift-chip{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.16);padding:12px 14px;border-radius:15px;margin-bottom:18px}
.shift-chip small{display:block;opacity:.72;margin-bottom:4px}
.shift-chip strong{font-size:14px}
.nav{display:grid;gap:5px;overflow:auto;padding-right:4px}
.nav button{border:0;background:transparent;color:rgba(255,255,255,.8);text-align:left;padding:11px 12px;border-radius:12px;font-weight:650;display:flex;gap:10px;align-items:center}
.nav button:hover,.nav button.active{background:rgba(255,255,255,.13);color:white}
.nav .ico{width:24px;height:24px;border:1px solid rgba(255,255,255,.22);border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:900}
.side-bottom{margin-top:auto;padding-top:12px;border-top:1px solid rgba(255,255,255,.16);display:grid;gap:8px}
.side-bottom button{border:0;border-radius:11px;padding:10px 12px;background:rgba(255,255,255,.09);color:white;text-align:left}
.version{font-size:11px;opacity:.6;padding:4px 2px}
.main{min-width:0}
.topbar{position:sticky;top:0;z-index:4;background:rgba(245,250,252,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:14px}
.dark .topbar{background:rgba(14,26,38,.9)}
.mobile-menu{display:none}
.search-wrap{flex:1;max-width:600px;position:relative}
.search-wrap input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);padding:12px 14px 12px 42px;border-radius:14px;outline:none}
.search-wrap:before{content:"⌕";position:absolute;left:15px;top:8px;font-size:25px;color:var(--muted)}
.top-actions{margin-left:auto;display:flex;gap:8px}
.top-actions button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px 12px}
.content{padding:26px;max-width:1500px;margin:auto}
.page{display:none}.page.active{display:block}
.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
.hero h1{margin:0;font-size:30px;letter-spacing:-.6px}
.hero p{margin:6px 0 0;color:var(--muted)}
.actions{display:flex;gap:9px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:750;background:var(--accent);color:white;box-shadow:0 8px 18px rgba(15,155,142,.18)}
.btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:var(--danger)}
.btn.small{padding:8px 11px;font-size:13px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.stat{position:relative;overflow:hidden}
.stat:after{content:"+";position:absolute;right:12px;top:2px;font-size:58px;color:rgba(15,155,142,.07);font-weight:200}
.stat small{color:var(--muted);font-weight:700}.stat strong{display:block;font-size:30px;margin-top:8px}
.progress{height:9px;background:var(--bg2);border-radius:999px;overflow:hidden}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--cyan));border-radius:999px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}
.section-title h2{margin:0;font-size:18px}.section-title small{color:var(--muted)}
.patient-card{position:relative;transition:.2s transform,.2s box-shadow}
.patient-card:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(22,50,79,.13)}
.patient-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.room{font-size:13px;color:var(--muted);font-weight:800;letter-spacing:.4px}
.patient-name{font-weight:900;font-size:20px;margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;background:var(--bg2);color:var(--text);border:1px solid var(--line)}
.badge.success{background:rgba(95,174,139,.12);color:var(--success)}
.badge.warn{background:rgba(229,168,75,.12);color:var(--amber)}
.badge.danger{background:rgba(229,121,114,.12);color:var(--danger)}
.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:14px}
.meta div{background:var(--bg);border-radius:12px;padding:10px}
.meta small{display:block;color:var(--muted);font-size:11px}.meta strong{font-size:13px}
.list{display:grid;gap:9px}
.list-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:13px;background:var(--bg);border:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--teal);flex:none}
.list-item .grow{flex:1}.list-item small{color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:13px;padding:14px;text-align:left;font-weight:750}
.quick button:hover{border-color:var(--accent);transform:translateY(-1px)}
.empty{text-align:center;padding:34px;color:var(--muted)}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px}
table{width:100%;border-collapse:collapse;background:var(--card)}
th,td{padding:12px 13px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;background:var(--bg)}
tr:last-child td{border-bottom:0}
.tabs{display:flex;gap:8px;overflow:auto;margin:0 0 16px}
.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:9px 13px;font-weight:700}
.tabs button.active{background:var(--accent);color:white;border-color:var(--accent)}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.field{display:grid;gap:6px}
.field label{font-size:12px;font-weight:800;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:11px 12px;outline:none;width:100%}
.field textarea{min-height:110px;resize:vertical}
.field.full{grid-column:1/-1}
.sbar-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.sbar-card{border-left:5px solid var(--accent)}
.sbar-letter{width:38px;height:38px;border-radius:12px;background:var(--accent);color:white;display:grid;place-items:center;font-weight:900;font-size:20px}
.sbar-title{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.sbar-title h3{margin:0}.sbar-card textarea{width:100%;min-height:150px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:12px;resize:vertical}
.accordion{display:grid;gap:10px}
.acc{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:var(--card)}
.acc button{width:100%;border:0;background:var(--card);color:var(--text);padding:13px 15px;text-align:left;font-weight:800;display:flex;justify-content:space-between}
.acc .acc-body{display:none;padding:0 15px 15px}.acc.open .acc-body{display:block}
.timeline{display:grid;gap:8px}
.timeline-row{display:grid;grid-template-columns:80px 1fr;gap:12px;align-items:start}
.timeline-time{font-weight:850;color:var(--muted);padding-top:10px}
.timeline-slot{min-height:44px;background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:8px 10px}
.handoff-shell{max-width:960px;margin:auto}
.handoff-card{font-size:15px}
.handoff-block{margin-top:14px;padding:14px;background:var(--bg);border-radius:14px}
.practice-hero{background:linear-gradient(135deg,rgba(15,155,142,.13),rgba(56,191,195,.08));border:1px solid rgba(15,155,142,.25);position:relative;overflow:hidden}
.practice-hero:after{content:"+";position:absolute;right:26px;top:-18px;font-size:130px;color:rgba(15,155,142,.08);font-weight:200}
.case-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.case-card{cursor:pointer}.case-card:hover{border-color:var(--accent)}
.ribbon{display:inline-block;background:var(--amber);color:#3a2b0d;font-weight:900;font-size:11px;padding:6px 10px;border-radius:999px}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.switch{width:48px;height:26px;border-radius:999px;background:#B7C7D1;position:relative;transition:.2s}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;background:white;border-radius:50%;transition:.2s}
.switch.on{background:var(--accent)}.switch.on:after{left:25px}
.modal-backdrop{position:fixed;inset:0;background:rgba(6,20,31,.54);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.modal-backdrop.show{display:flex}
.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:22px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.25)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0}.modal-close{border:0;background:transparent;color:var(--muted);font-size:24px}
.modal-body{padding:20px}
.modal-foot{padding:16px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.toast-wrap{position:fixed;right:20px;bottom:20px;z-index:70;display:grid;gap:8px}
.toast{background:#16324F;color:white;padding:12px 15px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);animation:in .2s ease}
@keyframes in{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
.hidden{display:none!important}
.search-results{position:absolute;left:0;right:0;top:50px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:380px;overflow:auto;display:none}
.search-results.show{display:block}
.search-res{padding:11px 13px;border-bottom:1px solid var(--line);cursor:pointer}
.search-res:hover{background:var(--bg)}.search-res small{display:block;color:var(--muted)}
.privacy-mask{filter:blur(5px);user-select:none}
.medical-bg{position:fixed;pointer-events:none;right:4vw;bottom:3vh;width:180px;height:180px;opacity:.045;z-index:-1}
.medical-bg:before,.medical-bg:after{content:"";position:absolute;background:var(--teal);border-radius:10px}
.medical-bg:before{width:110px;height:28px;left:35px;top:76px}
.medical-bg:after{width:28px;height:110px;left:76px;top:35px}
@media(max-width:1050px){
  .app{grid-template-columns:86px 1fr}.sidebar{padding:20px 12px}.brand-name,.shift-chip,.nav .label,.version{display:none}.brand{justify-content:center}.nav button{justify-content:center}.side-bottom button{text-align:center;font-size:0}.side-bottom button:before{content:"⚙";font-size:18px}.grid4{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:760px){
  .app{display:block}.sidebar{position:fixed;left:-290px;width:270px;transition:.2s;z-index:30}.sidebar.open{left:0}.brand-name,.shift-chip,.nav .label,.version{display:block}.nav button{justify-content:flex-start}.mobile-menu{display:block;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:11px;padding:9px 11px}.content{padding:18px}.topbar{padding:12px}.grid4,.grid3,.grid2,.settings-grid,.sbar-grid,.case-grid{grid-template-columns:1fr}.hero{flex-direction:column}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.quick{grid-template-columns:1fr 1fr}.meta{grid-template-columns:1fr 1fr}
}
@media print{
  .sidebar,.topbar,.no-print,.actions{display:none!important}.app{display:block}.content{padding:0}.page{display:none!important}.page.active{display:block!important}.card{box-shadow:none}
}

/* ============================================================
   V2 — CASH REGISTER COMMAND CENTER INTERACTION PATTERN
   Horizontal primary navigation + interactive cards + modal search
   ============================================================ */

.app{display:flex!important;flex-direction:column!important;min-height:100vh!important}
.sidebar{display:none!important}
.main{min-width:0;width:100%;flex:1}

.app-topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:14px;
  padding:10px 20px;
  background:color-mix(in srgb,var(--card) 94%,transparent);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
.dark .app-topbar{background:rgba(14,26,38,.94)}

.topbar-brand{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  min-width:max-content
}
.topbar-brand .brand-mark{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--navy),var(--teal));
  border:0;box-shadow:0 8px 20px rgba(15,155,142,.18)
}
.topbar-brand .brand-mark:before,.topbar-brand .brand-mark:after{background:#fff}
.topbar-brand .brand-mark:before{width:18px;height:4px}
.topbar-brand .brand-mark:after{width:4px;height:18px}
.topbar-brand .brand-name{font-size:15px;color:var(--text);font-weight:850;line-height:1.05}
.topbar-brand .brand-sub{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px;font-weight:750}

.topbar-search{
  flex:1 1 auto;max-width:660px;min-width:180px;
  display:flex;align-items:center;gap:9px;
  border:1px solid var(--line);background:var(--bg2);color:var(--muted);
  border-radius:999px;padding:9px 14px;transition:.15s;
  text-align:left;cursor:pointer
}
.topbar-search:hover{border-color:var(--accent);background:var(--card)}
.topbar-search:active{transform:scale(.995)}
.topbar-search:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search-icon{font-size:21px;line-height:1;transform:translateY(-1px)}
.topbar-search-label{font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-search kbd{
  font-size:10px;background:var(--card);border:1px solid var(--line);
  border-radius:6px;padding:3px 7px;color:var(--muted)
}

.shift-chip.compact{
  flex:0 0 auto;margin:0!important;padding:7px 11px!important;
  border:1px solid var(--line)!important;background:var(--card)!important;
  color:var(--text)!important;border-radius:12px!important;
  min-width:145px;box-shadow:none!important
}
.shift-chip.compact small{font-size:9px;color:var(--muted);opacity:1!important;margin-bottom:2px!important}
.shift-chip.compact strong{font-size:12px!important;display:block;white-space:nowrap}

.top-actions{display:flex;align-items:center;gap:7px;margin-left:auto}
.header-btn{
  border:1px solid var(--line);background:var(--card);color:var(--text);
  border-radius:999px;padding:9px 12px;font-weight:750;transition:.15s
}
.header-btn:hover{background:var(--bg2);border-color:var(--accent)}
.header-btn:active{transform:scale(.96)}
.header-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.header-btn.icon-only{width:38px;height:38px;padding:0;display:grid;place-items:center;font-size:17px}

.tabbar-wrap{
  position:sticky;top:59px;z-index:35;
  background:var(--bg);
  padding:12px 20px 0;
  border-bottom:0
}
.dark .tabbar-wrap{background:var(--bg)}
.nav.tabbar{
  display:flex!important;gap:3px!important;overflow-x:auto!important;
  padding:0!important;border-bottom:1px solid var(--line);
  scrollbar-width:none;-ms-overflow-style:none
}
.nav.tabbar::-webkit-scrollbar{display:none}
.nav.tabbar .tab-btn{
  flex:0 0 auto;display:flex;align-items:center;gap:7px;
  border:0!important;border-bottom:2px solid transparent!important;
  background:transparent!important;color:var(--muted)!important;
  border-radius:8px 8px 0 0!important;
  padding:10px 13px!important;font-size:13px!important;font-weight:700!important;
  white-space:nowrap;transition:.15s;box-shadow:none!important
}
.nav.tabbar .tab-btn:hover{color:var(--text)!important;background:var(--bg2)!important}
.nav.tabbar .tab-btn:active{opacity:.78}
.nav.tabbar .tab-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.nav.tabbar .tab-btn.active{
  color:var(--accent)!important;background:transparent!important;
  border-bottom-color:var(--accent)!important
}
.nav.tabbar .ico{
  width:23px!important;height:23px!important;border-radius:7px!important;
  border:1px solid var(--line)!important;background:var(--card)!important;
  color:var(--accent)!important;font-size:9px!important
}
.nav.tabbar .tab-btn.active .ico{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important}

.content{padding:20px!important;max-width:1400px!important;width:100%!important;margin:0 auto!important}
.page{animation:pageFade .18s ease}
@keyframes pageFade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.card{
  transition:box-shadow .15s ease,transform .15s ease,border-color .15s ease,background .15s ease
}
.interactive-card,.card[data-nav],.stat.interactive,.list-item.interactive{cursor:pointer}
.interactive-card:hover,.card[data-nav]:hover,.stat.interactive:hover{
  transform:translateY(-2px);box-shadow:0 16px 36px rgba(22,50,79,.13);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))
}
.interactive-card:active,.card[data-nav]:active,.stat.interactive:active{transform:translateY(0) scale(.995)}
.list-item.interactive{transition:.12s;background var(--bg)}
.list-item.interactive:hover{background:var(--bg2);border-color:var(--accent);transform:translateX(2px)}

.quick button{transition:.15s transform,.15s border-color,.15s background,.15s box-shadow}
.quick button:hover{border-color:var(--accent);background:var(--bg2);box-shadow:0 8px 18px rgba(15,155,142,.10)}
.quick button:active{transform:scale(.985)}

.btn,.top-actions button,.tabs button,.acc button,.case-card,.patient-card{
  touch-action:manipulation
}
.btn:active,.tabs button:active{transform:scale(.975)}

.search-modal-overlay{
  position:fixed;inset:0;z-index:90;background:rgba(8,23,34,.52);
  display:flex;align-items:flex-start;justify-content:center;padding:9vh 18px 24px;
  animation:searchOverlayIn .14s ease
}
@keyframes searchOverlayIn{from{opacity:0}to{opacity:1}}
.search-panel{
  width:min(760px,100%);max-height:78vh;overflow:hidden;
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  box-shadow:0 30px 90px rgba(0,0,0,.26);display:flex;flex-direction:column
}
.search-input-row{
  display:flex;align-items:center;gap:10px;padding:13px 15px;
  border-bottom:1px solid var(--line);background:var(--card)
}
.search-input-row .big-search-icon{font-size:24px;color:var(--accent)}
.search-input-row input{
  flex:1;min-width:0;border:0!important;outline:0!important;background:transparent!important;
  color:var(--text)!important;padding:8px 0!important;font-size:16px
}
.search-close{

/* ===== V8 QA / dark mode / smart actions ===== */
:root{--accent-dark:#195B91;--accent-soft:#EEF6FD;--accent-border:#C7DDEC}

 {title:'Post-Op Appendectomy',unit:'Post-Op',level:'Beginner',scenario:'Room 204A, adult patient, post-op appendectomy. Pain 5/10, BP stable, dressing dry, IV fluids running, next analgesic due in 30 minutes.',example:{s:'Post-op appendectomy patient with moderate pain, otherwise stable.',b:'Returned from OR earlier this shift. Dressing dry, IV fluids infusing.',a:'Pain 5/10. Vitals stable. No new drainage noted.',r:'Continue ordered monitoring and communicate pending pain-medication timing during handoff.'}},
 {title:'Pneumonia Follow-Up',unit:'Med-Surg',level:'Beginner',scenario:'Patient admitted with pneumonia. On nasal cannula, oxygen saturation documented as stable on current support, productive cough, antibiotic dose scheduled later this shift.',example:{s:'Patient being monitored for pneumonia and respiratory symptoms.',b:'Admitted for pneumonia; current oxygen support in use.',a:'Productive cough; current observations recorded without acute change.',r:'Handoff should include current oxygen support, next scheduled medication, and pending reassessment.'}},

function localDateISO(d=new Date()){
 const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
 return `${y}-${m}-${day}`;
}
function formatLocalDate(iso){
 if(!iso)return '';
 const [y,m,d]=String(iso).split('-').map(Number);
 const dt=new Date(y,(m||1)-1,d||1);
 return dt.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
}
function parseLocalDate(iso){
 const parts=String(iso||'').split('-').map(Number);
 const y=parts[0],m=parts[1],d=parts[2];
 if(!y||!m||!d)return new Date();
 return new Date(y,m-1,d,0,0,0,0);
}
function shiftTimeProgress(s,now=new Date()){
 if(!s?.start||!s?.end)return 0;
 const [sh,sm]=s.start.split(':').map(Number),[eh,em]=s.end.split(':').map(Number);
 let start=new Date(now);start.setHours(sh||0,sm||0,0,0);
 let end=new Date(now);end.setHours(eh||0,em||0,0,0);
 if(end<=start)end.setDate(end.getDate()+1);
 if(now<start && (end-start)>12*60*60*1000){start.setDate(start.getDate()-1);end.setDate(end.getDate()-1)}
 const pct=((now-start)/(end-start))*100;
 return Math.max(0,Math.min(100,Math.round(pct)));
}

 }catch(e){

function storageSet(key,value){
 __memoryStorageCache=value;
 try{
  const test='__sbar_storage_test__';

 }catch(e){

 }

function recencyStamp(item,fallbackIndex=0){
 const direct=Number(item?.updatedAt||item?.createdAt||0);
 if(direct)return direct;
 const t=String(item?.time||'').match(/^(\d{1,2}):(\d{2})/);
 if(t)return Number(t[1])*60+Number(t[2]);
 return fallbackIndex;
}

function recentFirst(arr){
 return (arr||[]).map((item,index)=>({item,index})).sort((a,b)=>{
   const sa=recencyStamp(a.item,a.index),sb=recencyStamp(b.item,b.index);
   if(sa!==sb)return sb-sa;
   return b.index-a.index;
 }).map(x=>x.item);
}

function shiftLiveStatus(s,now=new Date()){
 if(!s)return {label:'No active shift',sub:'Current Shift',state:'none'};
 const base=parseLocalDate(s.date||localDateISO());
 const [sh,sm]=String(s.start||'07:00').split(':').map(Number),[eh,em]=String(s.end||'19:00').split(':').map(Number);
 const start=new Date(base.getFullYear(),base.getMonth(),base.getDate(),sh||0,sm||0,0,0);
 const end=new Date(base.getFullYear(),base.getMonth(),base.getDate(),eh||0,em||0,0,0);
 if(end<=start)end.setDate(end.getDate()+1);
 const mins=n=>Math.max(0,Math.round(n/60000));
 const pretty=m=>{const h=Math.floor(m/60),r=m%60;return h?`${h}h ${r}m`:`${r}m`};
 if(now<start)return {sub:`${s.type||'Day'} Shift`,label:`Starts in ${pretty(mins(start-now))}`,state:'before'};
 if(now<=end)return {sub:`${s.type||'Day'} Shift`,label:`${pretty(mins(end-now))} remaining`,state:'active'};
 return {sub:`${s.type||'Day'} Shift`,label:`Ended ${pretty(mins(now-end))} ago`,state:'ended'};
}

function shiftHours(start,end){
 let a=parseInt(start)||7,b=parseInt(end)||19,arr=[`${String(a).padStart(2,'0')}:00`],cur=a;
 for(let i=0;i<12;i++){cur=(cur+1)%24;arr.push(`${String(cur).padStart(2,'0')}:00`);if(cur===b)break}return arr;
}

function searchData(q){
 const z=String(q||'').trim().toLowerCase(),groups={};
 if(!z)return groups;
 const push=(group,item)=>{groups[group]=groups[group]||[];groups[group].push(item)};
 allPatients().forEach(p=>{
   const base=`${p.room||''} ${p.alias||''} ${p.diagnosis||''} ${p.provider||''} ${p.status||''}`;
   if(base.toLowerCase().includes(z))push('Patients',{title:`Room ${p.room} • ${p.alias}`,sub:`${p.diagnosis||'Patient'} • ${p.status||''}`,icon:'PT',page:'patients',pid:p.id});
   (p.tasks||[]).forEach(t=>{const hay=`${t.title} ${t.category} ${t.priority} ${t.time} ${t.notes||''}`;if(hay.toLowerCase().includes(z))push('Tasks',{title:t.title,sub:`Room ${p.room} • ${t.category} • ${t.time||'No time'}`,icon:'TK',page:'tasks',pid:p.id})});
   (p.meds||[]).forEach(m=>{const hay=`${m.name} ${m.dose} ${m.route} ${m.time} ${m.status} ${m.notes||''}`;if(hay.toLowerCase().includes(z))push('Medications',{title:m.name,sub:`Room ${p.room} • ${m.time||'No time'} • ${m.status}`,icon:'RX',page:'medications',pid:p.id})});
   (p.labs||[]).forEach(l=>{const hay=`${l.name} ${l.result} ${l.units} ${l.status} ${l.notes||''}`;if(hay.toLowerCase().includes(z))push('Labs & Tests',{title:l.name,sub:`Room ${p.room} • ${l.result||l.status||''}`,icon:'LB',page:'labs',pid:p.id})});
   (p.notes||[]).forEach(n=>{const hay=`${n.text} ${n.category} ${n.time}`;if(hay.toLowerCase().includes(z))push('Notes',{title:n.text.slice(0,70),sub:`Room ${p.room} • ${n.category||'Note'}`,icon:'NT',page:'notes',pid:p.id})});
   Object.entries(p.sbar||{}).forEach(([section,v])=>{if(String(v||'').toLowerCase().includes(z))push('SBAR Reports',{title:`${section[0].toUpperCase()+section.slice(1)} • ${p.alias}`,sub:String(v).slice(0,90),icon:'SB',page:'sbar',pid:p.id})});
   Object.entries(p.assessment||{}).forEach(([section,v])=>{if(`${section} ${v||''}`.toLowerCase().includes(z))push('Assessments',{title:`${section} • ${p.alias}`,sub:String(v||'').slice(0,90),icon:'AS',page:'assessment',pid:p.id})});
 });
 (shift()?.tasks||[]).forEach(t=>{const hay=`${t.title} ${t.category} ${t.priority} ${t.time} ${t.notes||''}`;if(hay.toLowerCase().includes(z))push('Tasks',{title:t.title,sub:`General Shift Task • ${t.time||'No time'}`,icon:'TK',page:'tasks',pid:''})});
 (shift()?.notes||[]).forEach(n=>{if(`${n.text} ${n.category}`.toLowerCase().includes(z))push('Notes',{title:n.text.slice(0,70),sub:`General Shift Note • ${n.category||'Note'}`,icon:'NT',page:'notes',pid:''})});
 (shift()?.timeline||[]).forEach(t=>{if(`${t.title} ${t.type} ${t.time}`.toLowerCase().includes(z))push('Timeline',{title:t.title,sub:`${t.type} • ${t.time}`,icon:'TL',page:'timeline',pid:''})});
 Object.keys(groups).forEach(k=>groups[k]=groups[k].slice(0,8));
 return groups;
}

function highlightPageMatches(q){
 clearPageSearchMarks();
 const needle=String(q||'').trim();if(!needle)return;
 const root=document.querySelector('.page.active');if(!root)return;
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(node){
   const parent=node.parentElement;
   if(!parent||['SCRIPT','STYLE','TEXTAREA','INPUT','SELECT','OPTION','BUTTON'].includes(parent.tagName)||parent.closest('.page-search-mark'))return NodeFilter.FILTER_REJECT;
   return node.nodeValue.toLowerCase().includes(needle.toLowerCase())?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;
 }});
 const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 nodes.slice(0,40).forEach(node=>{
   const text=node.nodeValue,lower=text.toLowerCase(),qLower=needle.toLowerCase();let pos=0,idx;const frag=document.createDocumentFragment();
   while((idx=lower.indexOf(qLower,pos))!==-1){
     frag.appendChild(document.createTextNode(text.slice(pos,idx)));
     const mark=document.createElement('mark');mark.className='page-search-mark';mark.textContent=text.slice(idx,idx+needle.length);frag.appendChild(mark);
     pos=idx+needle.length;
   }
   frag.appendChild(document.createTextNode(text.slice(pos)));node.replaceWith(frag);
 });
 const first=root.querySelector('.page-search-mark');if(first)first.scrollIntoView({behavior:'smooth',block:'center'});
}

   ${selectField('Fall Risk','m-fall',['Low','Medium','High'],e?.fallRisk)}
   ${selectField('Priority','m-priority',['Low','Medium','High'],e?.priority)}
   ${field('Provider','m-provider','text',e?.provider||'')}
   ${field('Status','m-status','text',e?.status||'Stable')}
  </div>`,`<button class="btn secondary" onclick="closeModal()">Cancel</button>${e?`<button class="btn danger" onclick="removePatient('${e.id}')">Delete</button>`:''}<button class="btn" onclick="savePatient('${e?.id||''}')">Save Patient</button>`);
 }
 if(!s)return toast('Create a shift first');
 if(type==='task') return showModal('Add Shift Task',`<div class="form-grid">
   ${field('Task','m-task','text','')}
   ${selectField('Patient','m-patient',['General',...allPatients().map(x=>`${x.room} • ${x.alias}`)])}
   ${selectField('Category','m-category',['Medication','Assessment','Lab','Procedure','Documentation','Follow-Up','Other'])}
   ${selectField('Priority','m-priority',['Low','Medium','High'],'Medium')}
   ${field('Time','m-time','time','')}
   ${field('Notes','m-notes','text','')}
  </div>`,`<button class="btn" onclick="addTask()">Add Task</button>`);
 if(type==='vital'){
  if(!p)return toast('Select a patient first');
  return showModal(`Record Vitals • ${esc(p.room)}`,`<div class="form-grid">
  ${field('Time','m-time','time',new Date().toTimeString().slice(0,5))}${field('Blood Pressure','m-bp','text','')}${field('Heart Rate','m-hr','text','')}${field('Respiratory Rate','m-rr','text','')}${field('Temperature','m-temp','text','')}${field('SpO₂','m-spo2','text','')}${field('Pain','m-pain','text','')}
  </div>`,`<button class="btn" onclick="addVital()">Save Vitals</button>`);
 }
 if(type==='med'){
  if(!p)return toast('Select a patient first');
  return showModal(`Add Medication • ${esc(p.room)}`,`<div class="form-grid">
  ${field('Medication','m-med','text','')}${field('Dose','m-dose','text','')}${field('Route','m-route','text','')}${field('Scheduled Time','m-time','time','')}${field('Frequency','m-frequency','text','As ordered')}${selectField('Status','m-status',['Scheduled','Due','Given','Held','Skipped'])}${field('Notes','m-notes','text','')}
  </div>`,`<button class="btn" onclick="addMed()">Add Medication</button>`);
 }
 if(type==='lab'){
  if(!p)return toast('Select a patient first');
  return showModal(`Add Lab/Test • ${esc(p.room)}`,`<div class="form-grid">
  ${field('Lab / Test','m-lab','text','')}${field('Result','m-result','text','')}${field('Units','m-units','text','')}${field('Time','m-time','time','')}${selectField('Status','m-status',['Pending','Resulted','Follow-up'])}${field('Notes','m-notes','text','')}
  </div>`,`<button class="btn" onclick="addLab()">Add Lab/Test</button>`);
 }
 if(type==='note') return showModal('Add Note',`<div class="form-grid">
  ${selectField('Patient','m-patient',['General',...allPatients().map(x=>`${x.room} • ${x.alias}`)])}
  ${selectField('Category','m-category',['Reminder','Observation','Question','Follow-up','Other'])}
  ${field('Time','m-time','time',new Date().toTimeString().slice(0,5))}
  <div class="field full"><label>Note</label><textarea id="m-note"></textarea></div>
  </div>`,`<button class="btn" onclick="addNote()">Add Note</button>`);
 if(type==='timeline') return showModal('Add Timeline Item',`<div class="form-grid">
  ${field('Title','m-title','text','')}${field('Time','m-time','time','')}${selectField('Type','m-type',['Medication','Assessment','Vitals','Lab','Task','Note','Other'])}
  </div>`,`<button class="btn" onclick="addTimeline()">Add Item</button>`);
}
function field(label,idv,type='text',value=''){return `<div class="field"><label>${label}</label><input id="${idv}" type="${type}" value="${esc(value)}"></div>`}
function selectField(label,idv,opts,selected=''){return `<div class="field"><label>${label}</label><select id="${idv}">${opts.map(o=>`<option ${o===selected?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}
function showModal(title,body,foot=''){document.getElementById('modalTitle').innerHTML=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalFoot').innerHTML=foot;document.getElementById('modalBackdrop').classList.add('show')}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('show');window.__confirmAction=null;setTimeout(()=>{document.getElementById('modalBody').innerHTML='';document.getElementById('modalFoot').innerHTML='';},140)}
function val(idv){return document.getElementById(idv)?.value||''}

function createShift(){
 if(!consumeDemoCredit('Create Shift'))return;
 const sh={id:id(),name:val('m-name')||'Untitled Shift',date:localDateISO(),type:val('m-type')||'Day',start:val('m-start')||'07:00',end:val('m-end')||'19:00',department:val('m-dept')||'Med-Surg',nurse:val('m-nurse'),archived:false,demo:false,patients:[],tasks:[],notes:[],timeline:[]};
 state.shifts.push(sh);state.activeShiftId=sh.id;selectedPatientId=null;save();closeModal();updateShiftChip();renderAll();toast('New shift created');navigate('dashboard')
}
function savePatient(pid){
 if(!pid && !demoPatientGate())return;
 if(!consumeDemoCredit(pid?'Save Patient':'Add Patient'))return;
 const now=Date.now();
 const obj={room:val('m-room'),alias:val('m-alias')||'Patient',age:val('m-age'),diagnosis:val('m-dx'),codeStatus:val('m-code'),allergies:val('m-allergies'),precautions:val('m-prec'),diet:val('m-diet'),activity:val('m-activity'),fallRisk:val('m-fall'),priority:val('m-priority'),provider:val('m-provider'),status:val('m-status')||'Stable',updatedAt:now};
 if(pid){Object.assign(allPatients().find(x=>x.id===pid),obj)}else{shift().patients.push({id:id(),createdAt:now,...obj,sbar:{situation:'',background:'',assessment:'',recommendation:''},assessment:{},vitals:[],meds:[],labs:[],tasks:[],notes:[]})}
 save();closeModal();renderAll()
}
function removePatient(pid){
 const p=allPatients().find(x=>x.id===pid);if(!p)return;
 showConfirmModal('Delete Patient',`Delete “${p.alias||'this patient'}”? This removes the patient and all related SBAR, vitals, medications, labs, tasks, and notes from this shift.`,'Delete',()=>commitRemovePatient(pid),'danger');
}
function commitRemovePatient(pid){shift().patients=shift().patients.filter(x=>x.id!==pid);if(selectedPatientId===pid)selectedPatientId=null;save();closeModal();renderAll();toast('Patient deleted')}
function addTask(){
 if(!consumeDemoCredit('Add Task'))return;
 const now=Date.now(),label=val('m-patient'),base={id:id(),createdAt:now,title:val('m-task')||'Untitled Task',category:val('m-category'),priority:val('m-priority'),time:val('m-time'),status:'Pending',notes:val('m-notes')};
 if(label==='General')shift().tasks.push(base);else{const p=allPatients().find(x=>`${x.room} • ${x.alias}`===label);if(p){p.tasks.push(base);markPatientRecent(p,now)}}
 save();closeModal();renderAll()
}
function addVital(){if(!consumeDemoCredit('Save Vitals'))return;const p=patient(),now=Date.now();p.vitals.push({id:id(),createdAt:now,time:val('m-time'),bp:val('m-bp'),hr:val('m-hr'),rr:val('m-rr'),temp:val('m-temp'),spo2:val('m-spo2'),pain:val('m-pain')});markPatientRecent(p,now);save();closeModal();renderVitals();renderDashboard()}
function addMed(){if(!consumeDemoCredit('Add Medication'))return;const p=patient(),now=Date.now();p.meds.push({id:id(),createdAt:now,name:val('m-med')||'Medication',dose:val('m-dose'),route:val('m-route'),time:val('m-time'),frequency:val('m-frequency'),status:val('m-status'),notes:val('m-notes')});markPatientRecent(p,now);save();closeModal();renderMeds();renderDashboard()}
function addLab(){if(!consumeDemoCredit('Add Lab/Test'))return;const p=patient(),now=Date.now();p.labs.push({id:id(),createdAt:now,name:val('m-lab')||'Lab/Test',result:val('m-result'),units:val('m-units'),time:val('m-time'),status:val('m-status'),notes:val('m-notes')});markPatientRecent(p,now);save();closeModal();renderLabs();renderDashboard()}
function addNote(){
 if(!consumeDemoCredit('Add Note'))return;
 const now=Date.now(),label=val('m-patient'),n={id:id(),createdAt:now,time:val('m-time'),category:val('m-category'),text:val('m-note')||'Note'};
 if(label==='General')shift().notes.push(n);else{const p=allPatients().find(x=>`${x.room} • ${x.alias}`===label);if(p){p.notes.push(n);markPatientRecent(p,now)}}
 save();closeModal();renderNotes();renderDashboard()
}
function addTimeline(){if(!consumeDemoCredit('Add Timeline Item'))return;shift().timeline.push({id:id(),createdAt:Date.now(),title:val('m-title')||'Timeline Item',time:val('m-time'),type:val('m-type')});save();closeModal();renderTimeline()}
function deleteItem(key,itemId){
 const p=patient();if(!p)return;
 const labels={vitals:'vital-sign entry',meds:'medication entry',labs:'lab/test entry',tasks:'task'};
 showConfirmModal('Delete Entry',`Delete this ${labels[key]||'entry'}? This action cannot be undone.`,'Delete',()=>commitDeleteItem(key,itemId),'danger');
}
function commitDeleteItem(key,itemId){const p=patient();if(!p)return;p[key]=p[key].filter(x=>x.id!==itemId);markPatientRecent(p);save();closeModal();renderPage(currentPage);renderDashboard();toast('Entry deleted')}

function downloadBackup(){
 const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`SBAR-Nurse-Report-Backup-${localDateISO()}.json`;a.click();URL.revokeObjectURL(a.href);toast('Backup downloaded')
}
function restoreBackup(e){
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{try{
  const data=JSON.parse(r.result);if(!data.shifts||!Array.isArray(data.shifts))throw 0;
  window.__pendingRestoreData=data;
  showConfirmModal('Restore Backup','Restore this backup and replace the current local app data? Download a backup first if you want to keep the current version.','Restore',commitRestoreBackup,'primary');
 }catch(err){toast('Invalid backup file')}};
 r.readAsText(f);e.target.value='';
}
function commitRestoreBackup(){
 if(!isFullVersion()){window.__pendingRestoreData=null;showUpgradeModal('Restore Backup is available in the full version.');return}
 if(!window.__pendingRestoreData)return;
 state=window.__pendingRestoreData;window.__pendingRestoreData=null;normalizeState();practiceDone=new Set(state.practiceDone||[]);privacy=Boolean(state.privacy);storageSet(STORAGE,JSON.stringify(state));closeModal();document.body.classList.toggle('dark',state.theme==='dark');document.body.classList.toggle('privacy-on',privacy);applyAccent(state.accent||'#2376B7');renderAll();updateShiftChip();updateTopbarButtons();updateProfileUI();toast('Backup restored');navigate('dashboard');
}
function resetDemo(){showConfirmModal('Reset Demo Data','Reset the free demo workspace? Your remaining demo credits will not be restored.','Reset Demo',commitResetDemo,'danger')}
function commitResetDemo(){state=initialState();practiceDone=new Set(state.practiceDone||[]);privacy=false;state.privacy=false;storageSet(STORAGE,JSON.stringify(state));closeModal();document.body.classList.remove('dark');document.body.classList.remove('privacy-on');applyAccent(state.accent||'#2376B7');renderAll();updateShiftChip();updateTopbarButtons();updateProfileUI();toast('Demo workspace reset');navigate('dashboard')}
function printCurrent(){window.print()}

<script>
(function(){
  const ORIGINAL_TITLE='SBAR Nurse Report';
  const ORIGINAL_SUB='by Plalinda Studio';

  window.toggleMobileShiftBrand=function(){
    if(window.innerWidth>820)return;

    const title=document.getElementById('brandMainTitle');
    const sub=document.getElementById('brandSubTitle');
    const pro=document.getElementById('brandProBadge');
    const trigger=document.querySelector('.mobile-shift-trigger');
    if(!title||!sub)return;

    const isShift=trigger?.dataset.mode==='shift';

    if(isShift){
      title.textContent=ORIGINAL_TITLE;
      sub.textContent=ORIGINAL_SUB;
      if(pro)pro.style.removeProperty('display');
      if(trigger){trigger.dataset.mode='brand';trigger.classList.remove('showing-shift')}
      return;
    }

    let live={sub:'Current Shift',label:'No active shift'};
    try{
      if(typeof shiftLiveStatus==='function')live=shiftLiveStatus(typeof shift==='function'?shift():null);
    }catch(e){}

    title.textContent=live.sub||'Current Shift';
    sub.textContent=live.label||'No active shift';
    if(pro)pro.style.setProperty('display','none','important');
    if(trigger){trigger.dataset.mode='shift';trigger.classList.add('showing-shift')}

    clearTimeout(window.__mobileShiftBrandTimer);
    window.__mobileShiftBrandTimer=setTimeout(()=>{
      title.textContent=ORIGINAL_TITLE;
      sub.textContent=ORIGINAL_SUB;
      if(pro)pro.style.removeProperty('display');
      if(trigger){trigger.dataset.mode='brand';trigger.classList.remove('showing-shift')}
    },5500);
  };

  function reinforceMobileBrand(){
    const trigger=document.querySelector('.mobile-shift-trigger');
    if(trigger){
      trigger.setAttribute('type','button');
      trigger.style.pointerEvents='auto';
      trigger.style.touchAction='manipulation';
    }
    if(window.innerWidth<=820){
      const title=document.getElementById('brandMainTitle');
      const sub=document.getElementById('brandSubTitle');
      if(title && !title.textContent.trim())title.textContent=ORIGINAL_TITLE;
      if(sub && !sub.textContent.trim())sub.textContent=ORIGINAL_SUB;
    }
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',reinforceMobileBrand,{once:true});
  }else{
    reinforceMobileBrand();
  }
})();
</script>


<script>
window.addEventListener('popstate',e=>{
  if(window.innerWidth>1024)return;
  const page=e.state?.sbarPage||String(location.hash||'').replace('#','')||'dashboard';
  if(document.getElementById('page-'+page))navigate(page,true);
});
window.addEventListener('load',()=>{
  updateDemoUI();
  const splash=document.getElementById('appSplash');
  const installed =
    document.documentElement.classList.contains('installed-app') ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
    window.navigator.standalone === true;

  if(splash){
    if(installed){
      splash.classList.remove('hide');
      setTimeout(()=>splash.classList.add('hide'),1250);
    }else{
      splash.classList.add('hide');
    }
  }

  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
});
</script>
